# NOTE: This file must stay pure ASCII.
# Alembic reads alembic.ini with encoding="locale". On a Chinese Windows install the
# locale encoding is GBK, so any non-ASCII byte here raises UnicodeDecodeError before
# Alembic even starts. Comments are intentionally in English for that reason.
#
# Run from the repository root:
#   alembic -c backend/alembic.ini upgrade head
# The %(here)s token below resolves to this file's directory, so the script location
# does not depend on the current working directory.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# The real URL comes from backend.core.config in migrations/env.py, so that migrations
# and the application always target the same database. Left empty on purpose: putting a
# connection string here would put it in the repository.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
