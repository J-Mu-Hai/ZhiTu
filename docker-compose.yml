services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-growth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-growth}
      POSTGRES_DB: ${POSTGRES_DB:-growth_agent}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-growth}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app/backend
      - ./shared:/app/shared
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    image: node:22-alpine
    working_dir: /app
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    profiles: ["frontend"]

volumes:
  pgdata:
  redisdata:
