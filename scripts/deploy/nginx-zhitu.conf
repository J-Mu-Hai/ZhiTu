# 知途 API 的 Nginx 反向代理 + TLS。
#
# **这份文件没有在真实服务器上跑过**(本机没有 Nginx)。上线时逐行看一遍。
#
# 为什么必须有 TLS:
#   1. Web 端部署在 Vercel 上,是 https。**https 页面调用 http 接口会被浏览器
#      直接拦掉**(mixed content),表现是"点登录没反应",控制台里一行红字。
#   2. 登录请求里带着密码,而登录接口是 POST JSON。
#
# 安装:
#   sudo cp scripts/deploy/nginx-zhitu.conf /etc/nginx/sites-available/zhitu-api
#   sudo ln -s /etc/nginx/sites-available/zhitu-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 证书用 certbot 签(它会自己改这个文件里的 ssl_certificate 两行):
#   sudo certbot --nginx -d api.example.com

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # certbot 会在这里插一段 301 到 https。
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    # certbot 填这两行。
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    # 一次规划请求要等模型。应用侧的 LLM_TIMEOUT_SECONDS 是 30,加上组装上下文、
    # 校验提案、写库,实测一轮要十几到几十秒。Nginx 默认的 proxy_read_timeout 是 60 秒,
    # 而它一旦超时,用户看到的是 504,而**后端那一次调用其实还在跑** ——
    # 用户会以为没成功、再点一次,于是库里多一轮。所以这里给到 120。
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # 请求体都不大(一条消息上限 4000 字,见 MAX_MESSAGE_CHARS)。给 1m 足够,
    # 也顺手挡住"往这个接口塞大文件"。
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;

        # 应用不看这些头,但日志和以后按 IP 限流要看。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 不缓冲响应:规划请求本来就是长请求,缓冲只会让它看起来更慢。
        proxy_buffering off;
    }

    # 健康检查不进访问日志,否则每 10 秒一行会把真实请求淹掉。
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:8000/health;
    }
}
